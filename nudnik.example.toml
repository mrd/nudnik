# ntfy.sh topic — use one of these two options:
ntfy_topic = "your-topic-here"
# ntfy_topic_file = "/run/secrets/ntfy_topic"  # read topic from a file (e.g. for secrets)

log_file = "/var/log/nudnik.log"
state_file = "/var/lib/nudnik/state.json"

# Node identifier included in alert messages so recipients know which instance sent the alert.
# Defaults to the system hostname if omitted.
# node_name = "prod-monitor-us-east"

# Minimum seconds between repeated alerts for the same down site
alert_interval_seconds = 3600

# Retry a failed check this many times before treating the site as down (default 2, max 5).
# Delays use exponential backoff starting at 1s (1s, 2s, 4s, ...).
# retries = 2

# Per-request timeout in seconds
request_timeout_seconds = 10

# Default timezone for interpreting quiet_hours (IANA name, e.g. "America/New_York").
# Defaults to the system local timezone if omitted.
# timezone = "America/New_York"

# Global quiet hours: no alerts sent during this window (24-hour HH:MM, local time).
# Can be overridden per site. Use quiet_hours = false on a site to always alert.
# [quiet_hours]
# start = "23:00"
# end   = "07:00"

# Global quiet days: no alerts on these days of the week.
# Accepts full names or 3-letter abbreviations, case-insensitive.
# Can be overridden per site. Use quiet_days = [] or quiet_days = false to always alert.
# quiet_days = ["saturday", "sunday"]

[[sites]]
name = "My App"
url = "https://example.com/health"
keyword = "ok"

[[sites]]
name = "My Blog"
url = "https://myblog.com"
keyword = "Welcome"

[[sites]]
name = "Private Dashboard"
url = "https://internal.example.com/health"
keyword = "ok"
username = "monitor"
password = "secret"

# [[sites]]
# name = "Private Dashboard (auth from file)"
# url = "https://internal.example.com/health"
# keyword = "ok"
# auth_file = "/run/secrets/monitor_creds"  # file contains "username:password"

