[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nudnik"
version = "0.2.0"
requires-python = ">=3.8"
dependencies = [
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
nudnik = "nudnik:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["nudnik"]
